openapi: 3.1.0
info:
  title: AI Vision Detection API
  version: 1.0.0
  description: |
    OpenAPI contract for Pair 01 - Camera Stream -> AI Vision.
    Camera Stream sends image references after motion is detected so AI Vision
    can analyze the frame and return detection results for downstream services.
  contact:
    name: Group B4
servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://ai-vision.hospital-campus.local
    description: Class network placeholder
tags:
  - name: health
    description: Service health and readiness endpoints
  - name: vision
    description: Image detection operations
  - name: models
    description: AI model capability endpoints
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      description: Returns a simple health status for the AI Vision service.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: ai-vision
                    time: '2026-05-12T08:00:00Z'

  /vision/detect:
    post:
      operationId: createDetection
      summary: Submit an image detection request
      tags: [vision]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionRequest'
            examples:
              imageUrl:
                value:
                  requestId: REQ-CAM-20260512-0001
                  cameraId: CAM-ER-01
                  capturedAt: '2026-05-12T08:00:00Z'
                  traceId: TRACE-20260512-0001
                  zoneId: ER-ENTRANCE
                  motionLevel: 0.92
                  notes: Motion detected near emergency entrance
                  imageSource:
                    sourceType: IMAGE_URL
                    url: https://media.hospital.local/camera/CAM-ER-01/frame-1001.jpg
      responses:
        '202':
          description: Detection request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionSubmission'
              examples:
                accepted:
                  value:
                    detectionId: DET-20260512-0001
                    requestId: REQ-CAM-20260512-0001
                    traceId: TRACE-20260512-0001
                    status: PROCESSING
                    acceptedAt: '2026-05-12T08:00:01Z'
                    preliminaryResult: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /vision/detections/{detectionId}:
    get:
      operationId: getDetectionById
      summary: Get a detection result by ID
      tags: [vision]
      parameters:
        - $ref: '#/components/parameters/DetectionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Detection result found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionResult'
              examples:
                completed:
                  value:
                    detectionId: DET-20260512-0001
                    requestId: REQ-CAM-20260512-0001
                    traceId: TRACE-20260512-0001
                    status: COMPLETED
                    confidence: 0.98
                    riskLevel: HIGH
                    modelVersion: yolov11n-hospital-2.3.1
                    summary: Person detected in restricted area
                    alertHint: REVIEW_SECURITY
                    processedAt: '2026-05-12T08:00:01Z'
                    completedAt: '2026-05-12T08:00:02Z'
                    thumbnailUrl: https://media.hospital.local/thumbnails/DET-20260512-0001.jpg
                    objects:
                      - objectType: PERSON
                        label: human
                        confidence: 0.99
                        trackId: TRACK-77
                        boundingBox:
                          x: 0.12
                          y: 0.08
                          width: 0.41
                          height: 0.82
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /vision/models/info:
    get:
      operationId: getModelInfo
      summary: Get active model information
      tags: [models]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Active model information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'
              examples:
                activeModel:
                  value:
                    modelName: yolo-hospital-monitor
                    modelVersion: yolov11n-hospital-2.3.1
                    supportedObjectTypes: [PERSON, WHEELCHAIR, STRETCHER, SMOKE]
                    supportedImageSourceTypes: [IMAGE_URL, OBJECT_STORAGE_REF]
                    maxImageSizeBytes: 5242880
                    notes: Tuned for indoor hospital corridor and entrance cameras
                    lastUpdatedAt: '2026-05-01T00:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DetectionId:
      name: detectionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^DET-[0-9]{8}-[0-9]{4}$'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 100
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        time:
          type: string
          format: date-time
    ImageSource:
      type: object
      required: [sourceType]
      properties:
        sourceType:
          type: string
          enum: [IMAGE_URL, OBJECT_STORAGE_REF]
        url:
          type: string
          format: uri
        bucket:
          type: string
        objectKey:
          type: string
        expiresAt:
          type: string
          format: date-time
    DetectionRequest:
      type: object
      required: [requestId, cameraId, capturedAt, traceId, zoneId, motionLevel, imageSource]
      properties:
        requestId: { type: string }
        cameraId: { type: string }
        capturedAt: { type: string, format: date-time }
        traceId: { type: string }
        zoneId: { type: string }
        motionLevel: { type: number, minimum: 0, maximum: 1 }
        notes: { type: string }
        imageSource:
          $ref: '#/components/schemas/ImageSource'
    DetectionSubmission:
      type: object
      required: [detectionId, requestId, traceId, status, acceptedAt]
      properties:
        detectionId:
          type: string
          pattern: '^DET-[0-9]{8}-[0-9]{4}$'
        requestId: { type: string }
        traceId: { type: string }
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
        acceptedAt:
          type: string
          format: date-time
        preliminaryResult:
          type: object
          nullable: true
    BoundingBox:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }
    DetectionObject:
      type: object
      required: [objectType, label, confidence]
      properties:
        objectType:
          type: string
          enum: [PERSON, WHEELCHAIR, STRETCHER, SMOKE, UNKNOWN]
        label: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        trackId: { type: string }
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
    DetectionResult:
      type: object
      required: [detectionId, requestId, traceId, status, confidence, riskLevel]
      properties:
        detectionId:
          type: string
          pattern: '^DET-[0-9]{8}-[0-9]{4}$'
        requestId: { type: string }
        traceId: { type: string }
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
        confidence: { type: number, minimum: 0, maximum: 1 }
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        modelVersion: { type: string }
        summary: { type: string }
        alertHint: { type: string }
        processedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        thumbnailUrl: { type: string, format: uri }
        objects:
          type: array
          items:
            $ref: '#/components/schemas/DetectionObject'
    ModelInfo:
      type: object
      required: [modelName, modelVersion, supportedObjectTypes, supportedImageSourceTypes, maxImageSizeBytes]
      properties:
        modelName: { type: string }
        modelVersion: { type: string }
        supportedObjectTypes:
          type: array
          items:
            type: string
        supportedImageSourceTypes:
          type: array
          items:
            type: string
        maxImageSizeBytes:
          type: integer
          minimum: 1024
        notes: { type: string }
        lastUpdatedAt: { type: string, format: date-time }
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail: { type: string }
        instance: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: Payload too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
